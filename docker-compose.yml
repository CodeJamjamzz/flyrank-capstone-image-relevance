services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://metering:metering@postgres:5432/metering
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_INPUT_COST_PER_MILLION_UNITS: ${GEMINI_EMBEDDING_INPUT_COST_PER_MILLION_UNITS:-0}
      AI_COST_BUDGET_USD: ${AI_COST_BUDGET_USD:-1.00}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
    depends_on:
      postgres:
        condition: service_healthy

  image-worker:
    build: .
    command: ["python", "-m", "app.workers.image_processing_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://metering:metering@postgres:5432/metering
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-}
      GEMINI_VISION_INPUT_COST_PER_MILLION_UNITS: ${GEMINI_VISION_INPUT_COST_PER_MILLION_UNITS:-0}
      GEMINI_VISION_OUTPUT_COST_PER_MILLION_UNITS: ${GEMINI_VISION_OUTPUT_COST_PER_MILLION_UNITS:-0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_INPUT_COST_PER_MILLION_UNITS: ${GEMINI_EMBEDDING_INPUT_COST_PER_MILLION_UNITS:-0}
      AI_COST_BUDGET_USD: ${AI_COST_BUDGET_USD:-1.00}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      IMAGE_WORKER_POLL_INTERVAL_SECONDS: ${IMAGE_WORKER_POLL_INTERVAL_SECONDS:-5}
      IMAGE_WORKER_PROCESSING_DELAY_SECONDS: ${IMAGE_WORKER_PROCESSING_DELAY_SECONDS:-30}
      IMAGE_WORKER_RATE_LIMIT_BACKOFF_SECONDS: ${IMAGE_WORKER_RATE_LIMIT_BACKOFF_SECONDS:-3600}
      AI_BUDGET_BACKOFF_SECONDS: ${AI_BUDGET_BACKOFF_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: metering
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
